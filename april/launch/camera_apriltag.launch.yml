launch:
- arg:
    name: device
    default: "0"

- node_container:
    pkg: rclcpp_components
    exec: component_container
    name: apriltag_container
    namespace: ""
    composable_node:
    - pkg: camera_ros
      plugin: camera::CameraNode
      name: camera
      namespace: camera
      param:
      - name: camera
        value: $(var device)
      - name: format
        value: MJPEG
      - name: camera_info_url
        value: file:///home/nyu-rdt/april_test/src/RDT26-ROBOT/april/config/LogitechC615.yaml
      extra_arg:
      - name: use_intra_process_comms
        value: "True"

    - pkg: apriltag_ros
      plugin: AprilTagNode
      name: apriltag
      namespace: apriltag
      remap:
      - from: image_rect
        to: /camera/camera/image_raw
      - from: camera_info
        to: /camera/camera/camera_info
      param:
      - from: april/config/tags_36h11.yaml
      extra_arg:
      - name: use_intra_process_comms
        value: "True"