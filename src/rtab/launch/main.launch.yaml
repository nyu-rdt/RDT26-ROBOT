launch:
  - include:
      file: "$(find-pkg-share realsense2_camera)/launch/rs_launch.py"
      arg:
      - name: "align_depth.enable"
        value: "true"

      # - name: "initial_reset"
      #   value: "true"

      - name: "pointcloud.enable"
        value: "true"

      # - name: "clip_distance"
      #   value: "10"
      - name: "spatial_filter.enable"
        value: "true"        # smooth depth data
      - name: "temporal_filter.enable"
        value: "true"        # reduce flickering in depth
        
      - name: "enable_infra1"
        value: "true"

      - name: "enable_infra2"
        value: "true"

      - name: "enable_sync"
        value: "true"

      - name: "enable_gyro"
        value: "true"

      - name: "enable_accel"
        value: "true"

      - name: "depth_module.depth_profile"
        value: "480x270x15"

      - name: "depth_module.infra_profile"
        value: "480x270x15"

      - name: "rgb_camera.color_profile"
        value: "424x240x15"

      # - name: "rgb_camera.depth_profile"
      #   value: "424x240x5"

      # - name: "rgb_camera.infra_profile"
      #   value: "424x240x5"

      - name: "decimation_filter.enable"
        value: "true"

      - name: "decimation_filter.filter_magnitude"
        value: "2"

      - name: "colorizer.enable"
        value: "false"

      - name: "rgb_transport"
        value: "raw"

      - name: "depth_transport"
        value: "raw"

      # Reduce latency
      - name: "depth_module.frames_queue_size"
        value: "5"

      - name: "rgb_camera.frames_queue_size"
        value: "5"

      # Reduce internal filter buffering
      - name: "spatial_filter.frames_queue_size"
        value: "5"

      - name: "temporal_filter.frames_queue_size"
        value: "5"

      - name: "hole_filling_filter.enable"
        value: "false"

      - name: "disparity_filter.enable"
        value: "false"

      - name: "hdr_merge.enable"
        value: "false"

      # Slight clip distance for stability (optional but helpful indoors)
      - name: "clip_distance"
        value: "5.0"

  # - node:
  #     pkg: "tf2_ros"
  #     exec: "static_transform_publisher"
  #     name: "base_to_camera"
  #     args: "0 0 -.25 0 0 0 base_link camera_link"


# Opens rtabmap
  - include:
     file: "$(find-pkg-share rtabmap_launch)/launch/rtabmap.launch.py"
     arg:
       - name: "args"
         value: "--delete_db_on_start"
      #  - name: "config_path"
      #    value: "config/rtabmap_params.yaml"
       - name: "depth_topic"
         value: "/camera/camera/aligned_depth_to_color/image_raw"
       - name: "rgb_topic"
         value: "/camera/camera/color/image_raw"
       - name: "camera_info_topic"
         value: "/camera/camera/color/camera_info"
       - name: "approx_sync"
         value: "true"
       - name: "frame_id"
         value: "camera_link"
       - name: "sync_queue_size"
         value: "10"
       - name: "topic_queue_size"
         value: "10"

      #  - name: "Odom/Strategy" # ! HORRIBLE PARAMETER SETTING, DO MORE TESTING
      #    value: "1"

       - name: "Vis/CorType" # * GOOD PARAM, DO NOT TOUCH!
         value: "1"

      #  - name: "Odom/ImageDecimation" # ! HORRIBLE PARAMETER SETTING, DO NOT USE
      #    value: "2"

       - name: "Odom/VisKeyFrameThr" # * BEST PARAM, DO NOT TOUCH, FAST AND ACURATE!!!
         value: "500"

       - name: "OdomF2M/MaxSize" # ~ GOOD PARAM, DO MORE TESTING
         value: "1000"

      #  - name: "OdomF2M/BundleAdjustment" # ! HORRIBLE PARAMETER SETTING, DO NOT USE, USE DEFAULT INSTEAD (1)
      #    value: "0"

       - name: "Vis/MaxFeatures" # ~ GOOD PARAM, DO MORE TESTING
         value: "500"

       - name: "Vis/MinInliers" # ~ GOOD PARAM, DO MORE TESTING, LOWER INCREASES RISK OF LOST TRACKING, BUT RUNS FASTER
         value: "15"

       - name: "Vis/Iterations" # ~ GOOD PARAM, DO MORE TESTING, LOWER INCREASES RISK OF LOST TRACKING
         value: "200"

      #  - name: "FAST/Threshold" # * GOOD PARAM, DO NOT TOUCH, USING DEFAULT IS BEST (20)
      #    value: "20"

       - name: "Rtabmap/DetectionRate" # * BEST PARAM, DO NOT TOUCH, FAST AND ACURATE!!!
         value: "2"

      #  - name: "Rtabmap/TimeThr" # ~ GOOD PARAM, DO MORE TESTING, UNSURE HOW MUCH IT HELPS
      #    value: "50"

       - name: "RGBD/LinearUpdate" # ~ GOOD PARAM, DO MORE TESTING, UNSURE HOW MUCH IT HELPS
         value: ".2"

       - name: "RGBD/AngularUpdate" # ~ GOOD PARAM, DO MORE TESTING, UNSURE HOW MUCH IT HELPS
         value: ".1"


      #  - name: "RGBD/AngularUpdate" # ~ GOOD PARAM, DO MORE TESTING, UNSURE HOW MUCH IT HELPS
      #    value: "0.2"

      # ^ Use default for now (500)
       - name: "Kp/MaxFeatures" # ~ GOOD PARAM, DO MORE TESTING, LOWER MEANS LESS POINTS TO REF, MORE MEANS MORE POINTS TO REF. MORE POINTS MEANS MORE COMPUTATION, BUT ALSO MORE ACCURATE
         value: "1500"

      #  - name: "Mem/STMSize" # TODO: DO MORE TESTING, DID NOT SEE MUCH DIFFERENCE IN TESTING
      #    value: "5"

      #  - name: "Mem/RecentWmRatio" # TODO: DO MORE TESTING, DID NOT SEE MUCH DIFFERENCE IN TESTING
      #    value: "0.1"

       - name: "Grid/DepthDecimation" # * BEST PARAM, DO NOT TOUCH, FAST AND ACURATE!!!
         value: "8"

       - name: "Grid/CellSize" # ~ GOOD PARAM, DO MORE TESTING, UNSURE HOW MUCH IT HELPS
         value: "0.07"

      #  - name: "Grid/NoiseFilteringRadius" # ! HORRIBLE PARAMETER SETTING, DO NOT USE, USE DEFAULT INSTEAD (1)
      #    value: "0.05"

      #  - name: "Grid/NoiseFilteringMinNeighbors" # TODO: DO MORE TESTING,
      #    value: "5"

      #  - name: "Grid/NormalsSegmentation" # * GOOD PARAM, DO NOT TOUCH, USING DEFAULT IS BEST (true)
      #    value: "true"

      #  - name: "Grid/MaxGroundAngle" # ~ GOOD PARAM, DO MORE TESTING, UNSURE HOW MUCH IT HELPS
      #    value: "30"

       - name: "Optimizer/Iterations" # * GOOD PARAM, DO NOT TOUCH,
         value: "100"

      #  - name: "RGBD/CreateOccupancyGrid" # * BEST PARAM, DO NOT TOUCH, FAST AND ACURATE!!! USE DEFAULT (true)
      #    value: "true"

       - name: "Grid/3D" # * BEST PARAM, DO NOT TOUCH, FAST AND ACURATE!!!
         value: "false"

       - name: "PyDetector/Cuda" # * BEST PARAM, DO NOT TOUCH, FAST AND ACURATE!!!
         value: "false"

       - name: "PyMatcher/Cuda" # * BEST PARAM, DO NOT TOUCH, FAST AND ACURATE!!!
         value: "false"

       - name: "SuperPoint/Cuda" # * BEST PARAM, DO NOT TOUCH, FAST AND ACURATE!!!
         value: "false"

       - name: "Grid/RayTracing" # * BEST PARAM, DO NOT TOUCH, FAST AND ACURATE!!!
         value: "false" # ! NEVER SET TO TRUE

      #  - name: "Grid/GroundIsObstacle" # !HORRIBLE PARAMETER SETTING, DO NOT MAKE TRUE (TAKES WALLS OUT OF EVERYTHING)
      #    value: "true"

      #  - name: "Grid/FlatObstacleDetected" # * GOOD PARAM, DO NOT TOUCH, USING DEFAULT IS BEST (true)
      #    value: "true"

       - name: "Grid/MapFrameProjection"
         value: "true"

       - name: "Grid/MaxObstacleHeight"
         value: "2.5"

      #  - name: "Grid/MinGroundHeight"
      #    value: "-0.25"

       - name: "Grid/MaxGroundHeight"
         value: "0.25"

       - name: "Mem/ImagePreDecimation"
         value: "2"

       - name: "Odom/ScanKeyFrameThr" # # * BEST PARAM, DO NOT TOUCH, PREVENTS SWAP MEMORY FROM GROWING TOO MUCH
         value: ".6"

      #  - name: "always_process_most_recent_frame"
      #    value: "false"