launch:
  - include:
      file: "$(find-pkg-share realsense2_camera)/launch/rs_launch.py"
      arg:
      - name: "align_depth.enable"
        value: "true"

      - name: "pointcloud.enable"
        value: "true"

      - name: "enable_infra1"
        value: "true"

      - name: "enable_infra2"
        value: "true"

      - name: "depth_module.depth_profile"
        value: "424x240x5"

      - name: "depth_module.infra_profile"
        value: "424x240x5"

      - name: "rgb_camera.color_profile"
        value: "424x240x5"

      - name: "rgb_camera.depth_profile"
        value: "424x240x5"

      - name: "rgb_camera.infra_profile"
        value: "424x240x5"

      - name: "decimation_filter.enable"
        value: "true"

      - name: "decimation_filter.filter_magnitude"
        value: "2"

      - name: "colorizer.enable"
        value: "false"

      - name: "rgb_transport"
        value: "raw"

      - name: "depth_transport"
        value: "raw"

      # Reduce latency
      - name: "depth_module.frames_queue_size"
        value: "2"

      - name: "rgb_camera.frames_queue_size"
        value: "2"

      # Reduce internal filter buffering
      - name: "spatial_filter.frames_queue_size"
        value: "1"

      - name: "temporal_filter.frames_queue_size"
        value: "1"

      # Disable filters you are not explicitly using
      - name: "spatial_filter.enable"
        value: "false"

      - name: "temporal_filter.enable"
        value: "false"

      - name: "hole_filling_filter.enable"
        value: "false"

      - name: "disparity_filter.enable"
        value: "false"

      - name: "hdr_merge.enable"
        value: "false"

      # Slight clip distance for stability (optional but helpful indoors)
      - name: "clip_distance"
        value: "5.0"



# Opens rtabmap
  - include:
     file: "$(find-pkg-share rtabmap_launch)/launch/rtabmap.launch.py"
     arg:
       - name: "args"
         value: "--delete_db_on_start"
       - name: "depth_topic"
         value: "/camera/camera/aligned_depth_to_color/image_raw"
       - name: "rgb_topic"
         value: "/camera/camera/color/image_raw"
       - name: "camera_info_topic"
         value: "/camera/camera/color/camera_info"
       - name: "approx_sync"
         value: "true"
       - name: "frame_id"
         value: "camera_link"
       - name: "queue_size"
         value: "10   "
       - name: "topic_queue_size"
         value: "10"
       - name: "Odom/Strategy"
         value: "1"
       - name: "Vis/CorType"
         value: "1"

       - name: "Odom/ImageDecimation"
         value: "2"

       - name: "Odom/VisKeyFrameThr"
         value: "200"

       - name: "OdomF2M/MaxSize"
         value: "800"

       - name: "OdomF2M/BundleAdjustment"
         value: "0"

       - name: "Vis/MaxFeatures"
         value: "400"

       - name: "Vis/MinInliers"
         value: "15"

       - name: "Vis/Iterations"
         value: "100"

       - name: "FAST/Threshold"
         value: "25"

       - name: "Rtabmap/DetectionRate"
         value: "2"

       - name: "Rtabmap/TimeThr"
         value: "700"

       - name: "RGBD/LinearUpdate"
         value: "0.2"

       - name: "RGBD/AngularUpdate"
         value: "0.2"

       - name: "Kp/MaxFeatures"
         value: "300"

       - name: "Mem/STMSize"
         value: "5"

       - name: "Mem/RecentWmRatio"
         value: "0.1"

       - name: "Grid/DepthDecimation"
         value: "8"

       - name: "Grid/CellSize"
         value: "0.07"

       - name: "Optimizer/Iterations"
         value: "10"

       - name: "RGBD/CreateOccupancyGrid"
         value: "false"

       - name: "Grid/3D"
         value: "false"

       - name: "PyDetector/Cuda"
         value: "false"

       - name: "PyMatcher/Cuda"
         value: "false"

       - name: "SuperPoint/Cuda"
         value: "false"


         